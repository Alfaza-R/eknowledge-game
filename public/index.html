<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eknowledge Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-root">

    <!-- SCREEN 0: pilih game -->
    <section id="screen-select" class="screen hidden">
      <h1>Eknowledge Game</h1>
      <p class="sub">Pilih game buat main bareng tim</p>
      <div id="game-list"></div>
      <div class="divider">atau</div>
      <div class="join-row">
        <input id="input-room-select" type="text" placeholder="Kode room" maxlength="6" />
        <button id="btn-join-select">Gabung</button>
      </div>
      <p id="select-error" class="error"></p>
    </section>

    <!-- SCREEN 1: home (bikin/gabung room buat 1 game) -->
    <section id="screen-home" class="screen hidden">
      <button id="btn-back" class="link-back">← Pilih game lain</button>
      <h1 id="home-title">Game</h1>
      <p class="sub" id="home-sub"></p>

      <label>Nama kamu
        <input id="input-name" type="text" placeholder="Nama kamu" maxlength="20" />
      </label>

      <button id="btn-create" class="primary">Bikin Room</button>

      <div class="divider">atau</div>

      <div class="join-row">
        <input id="input-room" type="text" placeholder="Kode room (6 huruf)" maxlength="6" />
        <button id="btn-join">Gabung</button>
      </div>

      <p id="home-error" class="error"></p>
    </section>

    <!-- SCREEN 2: lobby -->
    <section id="screen-lobby" class="screen hidden">
      <p class="sub" id="lobby-game"></p>
      <h2>Room <span id="lobby-code" class="code"></span></h2>
      <button id="btn-copy" class="ghost">Salin link undangan</button>
      <ul id="player-list"></ul>
      <button id="btn-start" class="primary hidden">Mulai</button>
      <p id="lobby-hint" class="hint"></p>
    </section>

    <!-- SCREEN 3: game (diisi per-game oleh client.js) -->
    <section id="screen-game" class="screen hidden"></section>

    <!-- isi nama dulu sebelum masuk room (dari link undangan / kode) -->
    <section id="screen-join" class="screen hidden">
      <h1>Masuk Room</h1>
      <p class="sub">Kode: <span id="join-code" class="code"></span></p>
      <label>Nama kamu
        <input id="input-name-join" type="text" placeholder="Ketik nama kamu" maxlength="20" />
      </label>
      <button id="btn-enter" class="primary">Masuk</button>
      <button id="btn-join-back" class="link-back" style="float:none; margin-top:.8rem;">← Batal</button>
      <p id="join-error" class="error"></p>
    </section>

    <!-- loading kecil pas nyambung via link undangan -->
    <section id="screen-loading" class="screen hidden">
      <p class="sub">Menyambung ke room…</p>
    </section>

  </div>

  <!-- muncul cuma pas main game meja di HP posisi potrait -->
  <div id="rotate-prompt">
    <div class="rotate-icon">📱</div>
    <p>Buat main game ini, <b>putar HP</b> kamu ke posisi <b>horizontal</b> 🔄</p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
